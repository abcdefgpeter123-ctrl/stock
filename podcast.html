<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PODCAST精華 · 台股儀表板</title>
<style>
:root{
  --bg:#0b0f1a;--bg2:#111827;--bg3:#1a2233;
  --border:rgba(167,139,250,0.18);--border2:rgba(167,139,250,0.32);
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#a78bfa;--up:#4ade80;--dn:#f87171;--warn:#fb923c;
  --font:'Noto Sans TC',sans-serif;--mono:'JetBrains Mono','Fira Mono',monospace;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;font-size:14px;line-height:1.6}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

.page{max-width:760px;margin:0 auto;padding:28px 16px 80px}

nav{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.nav-a{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;font-size:13px;text-decoration:none;
  background:var(--bg2);border:1px solid rgba(255,255,255,0.08);color:var(--text3);transition:all .15s}
.nav-a:hover{color:var(--accent);border-color:var(--accent);text-decoration:none}
.nav-a.active{background:rgba(167,139,250,0.12);border-color:rgba(167,139,250,0.4);color:var(--accent);font-weight:500}

.page-hd{margin-bottom:24px}
.page-hd h1{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
.page-hd p{font-size:13px;color:var(--text3)}

.note-bar{background:rgba(167,139,250,0.06);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--text3);margin-bottom:20px;line-height:1.7}
.note-bar strong{color:var(--text2)}

.ep-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px 26px}
.ep-eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:8px}
.ep-title{font-size:19px;font-weight:700;color:var(--text);margin-bottom:6px}
.ep-meta{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--text3);margin-bottom:20px;flex-wrap:wrap}
.ep-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text3)}

.transcript{display:flex;flex-direction:column;gap:14px;margin-bottom:22px;max-height:520px;overflow-y:auto;padding-right:6px}
.transcript p{font-size:13.5px;color:var(--text2);line-height:1.85;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.05)}
.transcript p:last-child{border-bottom:none}

/* ── 精華（Ollama 本機摘要）── */
.hl{display:flex;flex-direction:column;gap:18px;margin-bottom:20px}
.hl-sec{}
.hl-topic{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--accent);margin-bottom:9px}
.hl-topic::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent);flex-shrink:0}
.hl-pts{display:flex;flex-direction:column;gap:7px;padding-left:11px}
.hl-pt{display:flex;gap:9px;font-size:13.5px;color:var(--text2);line-height:1.75}
.hl-pt::before{content:"▸";color:var(--text3);flex-shrink:0}

.ep-show{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:600;
  background:rgba(167,139,250,0.14);border:1px solid var(--border2);color:var(--accent)}

.tr-toggle{background:none;border:1px solid var(--border);color:var(--text3);font-family:inherit;font-size:12px;
  padding:7px 14px;border-radius:20px;cursor:pointer;transition:all .15s}
.tr-toggle:hover{color:var(--accent);border-color:var(--border2)}

.ep-actions{display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:18px}
.btn-listen{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;
  background:rgba(167,139,250,0.12);border:1px solid var(--border2);color:var(--accent)}
.btn-listen:hover{background:rgba(167,139,250,0.2);text-decoration:none}

.empty-state{text-align:center;padding:60px 20px;color:var(--text3);background:var(--bg2);border:1px dashed var(--border);border-radius:12px}
.empty-state .icon{font-size:36px;margin-bottom:12px}
.empty-state .msg{font-size:14px;margin-bottom:6px;color:var(--text2)}
.empty-state .sub{font-size:12px}

.updated-tag{font-size:11px;color:var(--text3);text-align:right;margin-top:12px}
</style>
</head>
<body>
<div class="page">

  <nav>
    <a href="index.html" class="nav-a">🇹🇼 台股</a>
    <a href="us.html" class="nav-a">🇺🇸 美股</a>
    <a href="weekly_report.html" class="nav-a">📋 週報</a>
    <a href="anatomy.html" class="nav-a">🔬 晶片圖</a>
    <a href="health_check.html" class="nav-a">📋 健檢</a>
    <a href="podcast.html" class="nav-a active">🎙️ Podcast精華</a>
    <a href="trades.html" class="nav-a">📒 交易紀錄</a>
    <a href="guide.html" class="nav-a">📖 快速上手</a>
  </nav>

  <div class="page-hd">
    <h1>🎙️ PODCAST精華</h1>
    <p>每天自動追蹤多個財經 Podcast，有新集數就自動摘要</p>
  </div>

  <div class="note-bar">
    <strong>📌 說明：</strong>每天自動檢查各節目 RSS，有新集數就下載音檔，用 <strong>Whisper large-v3</strong> 轉逐字稿，再用本機 <strong>Ollama</strong> 摘要成重點（全程在自己電腦上跑，不經過任何雲端 API）。業配與閒聊由模型自行判斷後濾除。<b>內容由 AI 產生且語音辨識可能有同音字誤差，僅供快速瀏覽，投資決策請以原節目為準。</b>
  </div>

  <div id="ep-content">
    <div class="empty-state">
      <div class="icon">🎧</div>
      <div class="msg">尚未產生內容</div>
      <div class="sub">每日自動排程執行後會顯示各節目最新一集精華</div>
    </div>
  </div>

</div>

<script>
async function loadPodcast() {
  try {
    const res = await fetch('podcast_summary.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();

    // 舊版是單一集數的物件，新版是 episodes 陣列——兩種都能顯示
    const eps = data.episodes
      || (data.paragraphs ? [{ show: '股癌 Gooaye', show_url: data.show_url, title: data.title,
                               episode_no: data.episode_no, pub_date: data.pub_date,
                               transcript: data.paragraphs, highlights: [] }] : []);
    if (!eps.length) return;

    document.getElementById('ep-content').innerHTML =
      eps.map(renderEpisode).join('') +
      `<div class="updated-tag">內容更新時間：${esc(data.updated_at || '—')}</div>`;
  } catch (e) {
    console.error('載入失敗:', e);
  }
}

function renderEpisode(ep, i) {
  // 標題本身常已含集數（有的在開頭「EP684 |」，有的在中間「DJ有事嗎 | Ep.257」），
  // 只有開頭那種才剝掉並改用統一格式，中間那種就原樣保留，避免顯示成「EP257 … Ep.257」
  const raw     = (ep.title || '').trim();
  const leading = raw.match(/^EP\s*\.?\s*(\d+)\s*[|｜.]?\s*/i);
  const title   = leading ? raw.slice(leading[0].length).trim() : raw;
  const epNo    = leading ? `EP${leading[1]}` : '';
  const hl    = ep.highlights || [];
  const tr    = ep.transcript || [];

  const highlightsHtml = hl.length ? `
    <div class="hl">
      ${hl.map(s => `
        <div class="hl-sec">
          <div class="hl-topic">${esc(s.topic)}</div>
          <div class="hl-pts">
            ${(s.points || []).map(p => `<div class="hl-pt"><span>${esc(p)}</span></div>`).join('')}
          </div>
        </div>`).join('')}
    </div>` : '';

  // 沒有精華時（例如摘要失敗）才直接把逐字稿攤開，否則收在按鈕後面
  const transcriptHtml = tr.length ? (hl.length ? `
    <div class="transcript" id="tr-${i}" style="display:none">
      ${tr.map(p => `<p>${esc(p)}</p>`).join('')}
    </div>` : `
    <div class="transcript">${tr.map(p => `<p>${esc(p)}</p>`).join('')}</div>`) : '';

  const toggle = (hl.length && tr.length)
    ? `<button class="tr-toggle" onclick="toggleTr(${i}, this)">📄 展開完整逐字稿（${tr.length} 段）</button>` : '';

  return `
    <div class="ep-card" style="margin-bottom:18px">
      <div class="ep-eyebrow">${hl.length ? '本集精華' : '逐字稿'}</div>
      <div class="ep-title">${esc((epNo ? epNo + ' ' : '') + (title || ep.title || ''))}</div>
      <div class="ep-meta">
        <span class="ep-show">${esc(ep.show || '')}</span>
        <span>📅 ${esc(ep.pub_date || '—')}</span>
        ${ep.duration_min ? `<span class="dot"></span><span>⏱ ${ep.duration_min} 分鐘</span>` : ''}
      </div>
      ${highlightsHtml}
      ${transcriptHtml}
      <div class="ep-actions">
        <a class="btn-listen" href="${esc(ep.show_url || '#')}" target="_blank" rel="noopener">🎧 收聽完整節目</a>
        ${toggle}
      </div>
    </div>`;
}

function toggleTr(i, btn) {
  const el = document.getElementById(`tr-${i}`);
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'flex';
  btn.textContent = open ? btn.textContent.replace('收合', '展開')
                         : btn.textContent.replace('展開', '收合');
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

loadPodcast();
</script>
</body>
</html>
