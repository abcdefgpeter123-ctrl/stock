name: Update US Stock Data

on:
  schedule:
    # 每天台灣時間 07:00 執行（UTC 前一日 23:00），週一到週五
    # 美股收盤約台灣時間 04:00-05:00，07:00 抓取有 2-3 小時緩衝確保資料穩定
    # 目的：讓台股開盤（09:00）前就能參考美股走勢
    - cron: '0 23 * * 0-4'
  push:
    branches: [main]
    paths:
      - 'fetch_us_data.py'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write
  issues: write

jobs:
  update-us-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pip3 install requests yfinance pandas --break-system-packages --quiet

      - name: Fetch US stock data
        run: python3 fetch_us_data.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add us_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update US stock data $(date +'%Y-%m-%d %H:%M')"
            # 這個 job 要跑好幾分鐘，期間若有人推送（或另一支 workflow 先完成），
            # 遠端就會領先而讓 push 被拒。重試三次，每次先合併最新的遠端狀態。
            # -X ours 只在「同一段內容衝突」時生效，衝突的必然是本次重新產生的
            # 資料檔，保留本次結果才正確；沒被這支 workflow 動到的檔案不受影響。
            for i in 1 2 3; do
              if git push; then
                echo "推送成功"
                break
              fi
              echo "推送被拒（遠端已更新），合併後重試 $i/3"
              git pull --no-rebase --no-edit -X ours || exit 1
              sleep 3
            done
          fi

      # ── 失敗通知 ────────────────────────────────────────────────
      # 排程失敗如果沒人通知，就只能等到哪天發現數字不對才回頭查。
      # 用同一個標題去搜尋，已經有未關閉的 issue 就只留言，不重複開。
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "🔴 排程失敗：美股資料更新"
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "又失敗一次（$(date -u '+%Y-%m-%d %H:%M') UTC）：$URL"
          else
            gh issue create --title "$TITLE" \
              --body "$(printf '%s\n' "排程 \`update-us-data.yml\`  執行失敗。" "" "執行紀錄：$URL" "" "修好後請手動關閉這張 issue。")"
          fi
