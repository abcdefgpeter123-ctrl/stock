name: Update Podcast Summary

on:
  schedule:
    # 每天台灣時間 07:30 執行（UTC 23:30 前一日），趕在開盤前把昨晚到今早的新集數摘要好
    - cron: '30 23 * * *'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write
  issues: write

jobs:
  update-podcast:
    # 必須跑在自架的 Mac runner：Whisper large-v3 需要 Apple Silicon GPU 加速，
    # Ollama 的模型有 4.7GB，在 GitHub-hosted runner 上每次都要重新下載且只有 CPU，
    # 實務上跑不完。Mac 在排程時間必須是開機且醒著的狀態，否則當天會跳過。
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          pip3 install --quiet --break-system-packages \
            requests mlx-whisper opencc-python-reimplemented

      - name: Ensure Ollama is running
        run: |
          if ! curl -sf http://localhost:11434/api/tags >/dev/null; then
            echo "Ollama 未啟動，背景啟動中..."
            nohup ollama serve >/tmp/ollama.log 2>&1 &
            for i in $(seq 1 30); do
              curl -sf http://localhost:11434/api/tags >/dev/null && break
              sleep 2
            done
          fi
          curl -sf http://localhost:11434/api/tags >/dev/null \
            || { echo "❌ Ollama 啟動失敗"; exit 1; }
          ollama list | grep -q qwen2.5:7b || ollama pull qwen2.5:7b

      - name: Fetch + transcribe + summarize
        run: python3 fetch_podcast_summary.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ ! -f podcast_summary.json ]; then
            echo "podcast_summary.json 未產生，略過提交"
            exit 0
          fi
          git add podcast_summary.json podcast_sources.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update podcast summary $(date +'%Y-%m-%d %H:%M')"
            # 這個 job 要跑好幾分鐘，期間若有人推送（或另一支 workflow 先完成），
            # 遠端就會領先而讓 push 被拒。重試三次，每次先合併最新的遠端狀態。
            # -X ours 只在「同一段內容衝突」時生效，衝突的必然是本次重新產生的
            # 資料檔，保留本次結果才正確；沒被這支 workflow 動到的檔案不受影響。
            for i in 1 2 3; do
              if git push; then
                echo "推送成功"
                break
              fi
              echo "推送被拒（遠端已更新），合併後重試 $i/3"
              git pull --no-rebase --no-edit -X ours || exit 1
              sleep 3
            done
          fi

      # ── 失敗通知 ────────────────────────────────────────────────
      # 排程失敗如果沒人通知，就只能等到哪天發現數字不對才回頭查。
      # 用同一個標題去搜尋，已經有未關閉的 issue 就只留言，不重複開。
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "🔴 排程失敗：Podcast 摘要"
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "又失敗一次（$(date -u '+%Y-%m-%d %H:%M') UTC）：$URL"
          else
            gh issue create --title "$TITLE" \
              --body "$(printf '%s\n' "排程 \`update-podcast.yml\`  執行失敗。" "" "執行紀錄：$URL" "" "修好後請手動關閉這張 issue。")"
          fi
