name: Update Stock Data

on:
  schedule:
    # 每天台灣時間 18:30 執行（UTC 10:30），週一到週五
    # 17:00 收盤後 TWSE 需要約 1 小時才會發布 ETF 申購買回清單
    - cron: '30 10 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'fetch_data_full.py'
      - 'fetch_us_data.py'
      - 'generate_report.py'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip3 install requests yfinance anthropic beautifulsoup4 --break-system-packages --quiet

      - name: Fetch Taiwan stock data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 fetch_data_full.py

      - name: Fetch US stock data
        run: python3 fetch_us_data.py

      - name: Generate weekly report (Fridays only)
        run: |
          # 判斷今天是否為週五（台灣時間，UTC+8）
          DAY=$(TZ=Asia/Taipei date +%u)
          EVENT="${{ github.event_name }}"
          if [ "$DAY" = "5" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "週五或手動觸發，產生週報..."
            python3 generate_report.py
          else
            echo "今天是週${DAY}，跳過週報"
          fi

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json company_info.json us_data.json weekly_report.html targets.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update stock data $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
