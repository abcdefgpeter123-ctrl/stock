name: Update Stock Data

on:
  schedule:
    # 每天台灣時間 18:30 執行（UTC 10:30），週一到週五
    # 17:00 收盤後 TWSE 需要約 1 小時才會發布 ETF 申購買回清單
    - cron: '30 10 * * 1-5'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write

jobs:
  update-data:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip3 install requests yfinance anthropic beautifulsoup4 --break-system-packages --quiet

      - name: Fetch stock data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 fetch_data_full.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json company_info.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update stock data $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
