name: Update Stock Data

on:
  schedule:
    # 每天台灣時間 18:30 執行（UTC 10:30），週一到週五
    # 17:00 收盤後 TWSE 需要約 1 小時才會發布 ETF 申購買回清單
    - cron: '30 10 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'fetch_data_full.py'
      - 'generate_report.py'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write
  issues: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pip3 install requests yfinance anthropic beautifulsoup4 --break-system-packages --quiet

      # stocks.json 是監控清單的唯一來源，stocks.js 由它產生給網頁用。
      # 有人只改了 json 沒重跑同步時，這一步會補上，避免網頁清單落後。
      - name: Sync stock list
        run: python3 sync_stocks.py

      - name: Fetch Taiwan stock data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 fetch_data_full.py

      - name: Generate weekly report (Fridays only)
        run: |
          # 判斷今天是否為週五（台灣時間，UTC+8）
          DAY=$(TZ=Asia/Taipei date +%u)
          EVENT="${{ github.event_name }}"
          if [ "$DAY" = "5" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "週五或手動觸發，產生週報..."
            python3 generate_report.py
          else
            echo "今天是週${DAY}，跳過週報"
          fi

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json history_5y.json pe_river.json margin_history.json company_info.json weekly_report.html targets.json stocks.js
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update stock data $(date +'%Y-%m-%d %H:%M')"
            # 這個 job 要跑好幾分鐘，期間若有人推送（或另一支 workflow 先完成），
            # 遠端就會領先而讓 push 被拒。重試三次，每次先合併最新的遠端狀態。
            # -X ours 只在「同一段內容衝突」時生效，衝突的必然是本次重新產生的
            # 資料檔，保留本次結果才正確；沒被這支 workflow 動到的檔案不受影響。
            for i in 1 2 3; do
              if git push; then
                echo "推送成功"
                break
              fi
              echo "推送被拒（遠端已更新），合併後重試 $i/3"
              git pull --no-rebase --no-edit -X ours || exit 1
              sleep 3
            done
          fi

      # ── 失敗通知 ────────────────────────────────────────────────
      # 排程失敗如果沒人通知，就只能等到哪天發現數字不對才回頭查。
      # 用同一個標題去搜尋，已經有未關閉的 issue 就只留言，不重複開。
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "🔴 排程失敗：台股資料更新"
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "又失敗一次（$(date -u '+%Y-%m-%d %H:%M') UTC）：$URL"
          else
            gh issue create --title "$TITLE" \
              --body "$(printf '%s\n' "排程 \`update-data.yml\`  執行失敗。" "" "執行紀錄：$URL" "" "修好後請手動關閉這張 issue。")"
          fi
